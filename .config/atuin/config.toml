db_path = "~/.history.db"

dialect = "us"

timezone = "local"

auto_sync = true

update_check = true

sync_frequency = "10m"

search_mode = "fuzzy"

filter_mode = "global"

style = "compact"

invert = true

history_filter = [
  "^cd( |$)",
  "^mkdir ",
  "^ls?( |$)",
  "^n?v(im?)?( |$)",
  "^\\.\\."
]

enter_accept = true

keymap_mode = "vim-normal"

keymap_cursor = { emacs = "blink-block", vim_insert = "steady-bar", vim_normal = "steady-block" }

[stats]

[keys]

[sync]
records = true

[preview]

[daemon]

[search]
