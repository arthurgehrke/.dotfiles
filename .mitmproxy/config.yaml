showhost: true

console_layout: single

console_palette: dark

ignore_hosts:
  - '.*gstatic\.com'
  - '.*clients[0-9]*\.google\.com'
  - '.*googleusercontent\.com'
  - 'play\.google\.com'
  - 'mail\.google\.com'
  - '.*amazonaws\.com'
  - '.*super-agent\.com'

  - '.*apple\.com'
  - '.*icloud\.com'
  - '.*mzstatic\.com'
  - '.*aaplimg\.com'
  - '.*cdn-apple\.com'

  - '.*mozilla\.com'
  - '.*mozilla\.net'
  - '.*telemetry.*'
